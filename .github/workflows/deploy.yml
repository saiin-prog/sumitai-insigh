name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # SAFETY: Deploying to a subfolder 'sumitai-v2' to protect your main WordPress site.
          # You can view the site at: your-domain.com/sumitai-v2/
          server-dir: public_html/sumitai-v2/
